# solid_cable (DB-backed) instead of the default async adapter: async only pub-subs within a single
# process, which breaks broadcasts from UpdateFeedsJob (runs in the separate Solid Queue worker process
# started by bin/dev) reaching browsers connected to the web process.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
